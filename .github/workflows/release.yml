name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag the version and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 MARKETING_VERSION MacEdgeLight.xcodeproj/project.pbxproj | sed 's/.*= *\(.*\);/\1/' | tr -d ' ')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected MARKETING_VERSION '$version'."; exit 1; }
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          notes="docs/RELEASE_NOTES_$version.md"
          if [[ -f "$notes" ]]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "MacEdgeLight $tag" --notes-file "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "MacEdgeLight $tag" --generate-notes
          fi
          # The notarized DMG and ZIP are built locally (Xcode account authentication)
          # and attached afterwards: gh release upload "$tag" build/MacEdgeLight.dmg build/MacEdgeLight.zip
