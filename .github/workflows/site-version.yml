name: Marketing version consistency
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check full marketing version against Xcode
        run: python3 scripts/sync-site-version.py --check
